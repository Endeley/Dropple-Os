name: Dropple CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture Gate
        run: npm run arch

      - name: Determinism Gate
        run: npm run determinism

      - name: Template Verification
        run: npm run template:verify-all
        env:
          ENGINE_VERSION: ${{ secrets.ENGINE_VERSION }}
          ROOT_PUBLIC_KEY: ${{ secrets.ROOT_PUBLIC_KEY }}
