name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI (Architecture + Determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture Gate
        run: npm run arch

      - name: Architecture Monitor
        run: npm run architecture:monitor

      - name: Architecture CI
        run: npm run architecture:ci

      - name: Architecture Drift
        run: npm run architecture:drift

      - name: Runtime Map Test
        run: npm run runtime:map:test

      - name: Runtime Replay Determinism
        run: npm run runtime:replay:test

      - name: Runtime State Hash Stability
        run: npm run runtime:statehash:test

      - name: Determinism
        run: npm run determinism

  core-tests:
    name: Core Tests (Engine + Runtime + Kernel)
    runs-on: ubuntu-latest
    needs: fast-ci
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

      - name: Runtime system tests
        run: npm run test:system:runtime

  app-smoke:
    name: App Validation (Workspace + Routing)
    runs-on: ubuntu-latest
    needs: core-tests
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate app
        run: npm run validate:app

  full-repo-gate:
    name: Full Repo Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: app-smoke
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate all
        run: npm run validate:all

  release-trust-gate:
    name: Release Trust Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: full-repo-gate
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate release trust
        run: npm run validate:release
        env:
          ENGINE_VERSION: ${{ secrets.ENGINE_VERSION }}
          ROOT_PUBLIC_KEY: ${{ secrets.ROOT_PUBLIC_KEY }}

  release-trust-gate-pr:
    name: Release Trust Validation (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: app-smoke
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate release trust
        run: npm run validate:release
        env:
          ENGINE_VERSION: ${{ secrets.ENGINE_VERSION }}
          ROOT_PUBLIC_KEY: ${{ secrets.ROOT_PUBLIC_KEY }}
