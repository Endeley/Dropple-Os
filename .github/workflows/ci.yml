name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TRUST_BASELINE_REQUIRED_AFTER: '2026-07-01T00:00:00.000Z'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI (Architecture + Determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture Gate
        run: npm run arch

      - name: Architecture Monitor
        run: npm run architecture:monitor

      - name: Architecture CI
        run: npm run architecture:ci

      - name: Architecture Drift
        run: npm run architecture:drift

      - name: Runtime Map Test
        run: npm run runtime:map:test

      - name: Runtime Replay Determinism
        run: npm run runtime:replay:test

      - name: Runtime State Hash Stability
        run: npm run runtime:statehash:test

      - name: Determinism
        run: npm run determinism

  core-tests:
    name: Core Tests (Engine + Runtime + Kernel)
    runs-on: ubuntu-latest
    needs: fast-ci
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

      - name: Runtime system tests
        run: npm run test:system:runtime

  app-smoke:
    name: App Validation (Workspace + Routing)
    runs-on: ubuntu-latest
    needs: core-tests
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure non-interactive git auth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Clean generated release-trust artifacts
        run: npm run release:trust:clean-generated

      - name: Validate app
        run: npm run validate:app

  full-repo-gate:
    name: Full Repo Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: app-smoke
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate all
        run: npm run validate:all

  release-trust-gate:
    name: Release Trust Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: full-repo-gate
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Clean generated release-trust artifacts
        run: npm run release:trust:clean-generated

      - name: Fetch previous main os-surface probe baseline (main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts

          WORKFLOW_FILE="ci.yml"
          PROBE_ARTIFACT_NAME="os-surface-clickability-probe-main"
          CURRENT_RUN_ID="${{ github.run_id }}"

          RUN_ID="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f branch=main \
            -f status=success \
            -f event=push \
            -q ".workflow_runs[] | select((.id|tostring)!=\"${CURRENT_RUN_ID}\") | .id" | head -n 1 || true)"

          if [ -z "${RUN_ID}" ]; then
            echo "No previous successful main run found; skipping probe baseline download."
            exit 0
          fi

          PROBE_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${PROBE_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -z "${PROBE_ARTIFACT_ID}" ]; then
            echo "No ${PROBE_ARTIFACT_NAME} artifact found in run ${RUN_ID}; skipping probe baseline download."
            exit 0
          fi

          if ! gh api \
            "repos/${{ github.repository }}/actions/artifacts/${PROBE_ARTIFACT_ID}/zip" \
            > .artifacts/os-surface-clickability-probe-baseline.zip; then
            echo "Unable to download ${PROBE_ARTIFACT_NAME} from run ${RUN_ID}; skipping probe baseline download."
            exit 0
          fi

          unzip -o .artifacts/os-surface-clickability-probe-baseline.zip -d .artifacts/os-surface-clickability-probe-baseline-unpacked
          cp .artifacts/os-surface-clickability-probe-baseline-unpacked/os-surface-clickability-probe.json .artifacts/os-surface-clickability-probe-baseline.json
          echo "Main probe baseline ready at .artifacts/os-surface-clickability-probe-baseline.json"

      - name: Validate release trust
        run: npm run validate:release
        env:
          ENGINE_VERSION: ${{ secrets.ENGINE_VERSION }}
          ROOT_PUBLIC_KEY: ${{ secrets.ROOT_PUBLIC_KEY }}
          RELEASE_TRUST_REQUIRE_UI_PROBE: "1"

      - name: Append release trust ledger entry (main)
        run: npm run release:trust:ledger

      - name: Verify release trust ledger chain (main)
        run: npm run release:trust:ledger:verify

      - name: Append federation lineage ledger entry (main)
        run: npm run release:federation:lineage:ledger

      - name: Verify federation lineage ledger chain (main)
        run: npm run release:federation:lineage:ledger:verify

      - name: Append blueprint lineage ledger entry (main)
        run: npm run release:blueprint:lineage:ledger

      - name: Verify blueprint lineage ledger chain (main)
        run: npm run release:blueprint:lineage:ledger:verify

      - name: Upload release trust report (main)
        uses: actions/upload-artifact@v6
        with:
          name: release-trust-report-main
          path: .artifacts/release-trust.json
          if-no-files-found: error

      - name: Upload os surface clickability probe (main)
        uses: actions/upload-artifact@v6
        with:
          name: os-surface-clickability-probe-main
          path: .artifacts/os-surface-clickability-probe.json
          if-no-files-found: error

      - name: Publish os surface probe summary (main)
        if: always()
        env:
          RELEASE_TRUST_UI_PROBE_BASELINE_PATH: .artifacts/os-surface-clickability-probe-baseline.json
        run: node --import ./bench/register-alias-loader.mjs scripts/releaseTrustProbeSummary.mjs

      - name: Upload release trust ledger (main)
        uses: actions/upload-artifact@v6
        with:
          name: release-trust-ledger-main
          path: .artifacts/release-trust-ledger.jsonl
          if-no-files-found: error

      - name: Upload federation audit lineage (main)
        uses: actions/upload-artifact@v6
        with:
          name: federation-audit-lineage-main
          path: .artifacts/federation-audit-lineage.json
          if-no-files-found: error

      - name: Upload federation audit lineage ledger (main)
        uses: actions/upload-artifact@v6
        with:
          name: federation-audit-lineage-ledger-main
          path: .artifacts/federation-audit-lineage-ledger.jsonl
          if-no-files-found: error

      - name: Upload blueprint lineage ledger (main)
        uses: actions/upload-artifact@v6
        with:
          name: blueprint-lineage-ledger-main
          path: .artifacts/blueprint-lineage-ledger.jsonl
          if-no-files-found: error

  release-trust-gate-pr:
    name: PR Release Validation (validate:release)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Clean generated release-trust artifacts
        run: npm run release:trust:clean-generated

      - name: Validate release trust
        run: npm run validate:release
        env:
          ENGINE_VERSION: ${{ secrets.ENGINE_VERSION }}
          ROOT_PUBLIC_KEY: ${{ secrets.ROOT_PUBLIC_KEY }}
          RELEASE_TRUST_REQUIRE_UI_PROBE: "1"

      - name: Fetch main release trust baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p .artifacts
          WORKFLOW_FILE="ci.yml"
          REPORT_ARTIFACT_NAME="release-trust-report-main"
          PROBE_ARTIFACT_NAME="os-surface-clickability-probe-main"
          LEDGER_ARTIFACT_NAME="release-trust-ledger-main"
          FEDERATION_LINEAGE_ARTIFACT_NAME="federation-audit-lineage-main"
          FEDERATION_LINEAGE_LEDGER_ARTIFACT_NAME="federation-audit-lineage-ledger-main"
          BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_NAME="blueprint-lineage-ledger-main"
          BASELINE_DESTINATION=".artifacts/release-trust-baseline.json"

          enforce_baseline_acquisition() {
            local reason="$1"
            echo "Release trust baseline acquisition failed: ${reason}"
            exit 1
          }

          set +e
          RUN_ID_QUERY="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f branch=main \
            -f status=success \
            -f event=push \
            -q '.workflow_runs[0].id // empty' 2>&1)"
          RUN_ID_QUERY_EXIT=$?
          set -e

          if [ "${RUN_ID_QUERY_EXIT}" -ne 0 ]; then
            enforce_baseline_acquisition "unable to query main baseline run via GitHub Actions API. Reason: ${RUN_ID_QUERY}"
          fi
          RUN_ID="${RUN_ID_QUERY}"

          if [ -z "${RUN_ID}" ]; then
            enforce_baseline_acquisition "no eligible successful main run found for workflow=${WORKFLOW_FILE} branch=main event=push status=success"
          fi

          echo "Selected successful main baseline run id: ${RUN_ID}"

          REPORT_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${REPORT_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -z "${REPORT_ARTIFACT_ID}" ]; then
            enforce_baseline_acquisition "artifact ${REPORT_ARTIFACT_NAME} missing on successful main run ${RUN_ID}"
          fi

          echo "Selected main baseline artifact: name=${REPORT_ARTIFACT_NAME} id=${REPORT_ARTIFACT_ID}"

          if ! gh api \
            "repos/${{ github.repository }}/actions/artifacts/${REPORT_ARTIFACT_ID}/zip" \
            > .artifacts/release-trust-baseline.zip; then
            enforce_baseline_acquisition "unable to download artifact ${REPORT_ARTIFACT_NAME} (id=${REPORT_ARTIFACT_ID}) from run ${RUN_ID}"
          fi

          unzip -o .artifacts/release-trust-baseline.zip -d .artifacts/release-trust-baseline-unpacked
          if [ ! -f .artifacts/release-trust-baseline-unpacked/release-trust.json ]; then
            enforce_baseline_acquisition "downloaded artifact ${REPORT_ARTIFACT_NAME} from run ${RUN_ID} did not contain release-trust.json"
          fi
          cp .artifacts/release-trust-baseline-unpacked/release-trust.json "${BASELINE_DESTINATION}"
          if [ ! -f "${BASELINE_DESTINATION}" ]; then
            enforce_baseline_acquisition "failed to materialize baseline report at ${BASELINE_DESTINATION}"
          fi
          echo "Resolved baseline destination: ${BASELINE_DESTINATION}"
          echo "Baseline acquisition complete: report baseline ready at ${BASELINE_DESTINATION}"

          PROBE_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${PROBE_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -n "${PROBE_ARTIFACT_ID}" ]; then
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${PROBE_ARTIFACT_ID}/zip" \
              > .artifacts/os-surface-clickability-probe-baseline.zip; then
              echo "Unable to download ${PROBE_ARTIFACT_NAME} from run ${RUN_ID}; skipping os-surface probe baseline."
            else

              unzip -o .artifacts/os-surface-clickability-probe-baseline.zip -d .artifacts/os-surface-clickability-probe-baseline-unpacked
              cp .artifacts/os-surface-clickability-probe-baseline-unpacked/os-surface-clickability-probe.json .artifacts/os-surface-clickability-probe-baseline.json
              echo "Baseline os-surface probe ready at .artifacts/os-surface-clickability-probe-baseline.json"
            fi
          else
            echo "No ${PROBE_ARTIFACT_NAME} artifact found in run ${RUN_ID}; skipping os-surface probe baseline."
          fi

          LEDGER_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${LEDGER_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -z "${LEDGER_ARTIFACT_ID}" ]; then
            echo "No ${LEDGER_ARTIFACT_NAME} artifact found in run ${RUN_ID}; starting a new ledger chain for this PR run."
            exit 0
          fi

          if ! gh api \
            "repos/${{ github.repository }}/actions/artifacts/${LEDGER_ARTIFACT_ID}/zip" \
            > .artifacts/release-trust-ledger-baseline.zip; then
            echo "Unable to download ${LEDGER_ARTIFACT_NAME} from run ${RUN_ID}; starting a new ledger chain for this PR run."
            exit 0
          fi

          unzip -o .artifacts/release-trust-ledger-baseline.zip -d .artifacts/release-trust-ledger-baseline-unpacked
          cp .artifacts/release-trust-ledger-baseline-unpacked/release-trust-ledger.jsonl .artifacts/release-trust-ledger.jsonl
          echo "Baseline ledger seeded at .artifacts/release-trust-ledger.jsonl"

          FEDERATION_LINEAGE_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${FEDERATION_LINEAGE_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -n "${FEDERATION_LINEAGE_ARTIFACT_ID}" ]; then
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${FEDERATION_LINEAGE_ARTIFACT_ID}/zip" \
              > .artifacts/federation-audit-lineage-baseline.zip; then
              echo "Unable to download ${FEDERATION_LINEAGE_ARTIFACT_NAME} from run ${RUN_ID}; skipping federation lineage baseline."
            else

              unzip -o .artifacts/federation-audit-lineage-baseline.zip -d .artifacts/federation-audit-lineage-baseline-unpacked
              cp .artifacts/federation-audit-lineage-baseline-unpacked/federation-audit-lineage.json .artifacts/federation-audit-lineage-baseline.json
              echo "Federation baseline lineage ready at .artifacts/federation-audit-lineage-baseline.json"
            fi
          else
            echo "No ${FEDERATION_LINEAGE_ARTIFACT_NAME} artifact found in run ${RUN_ID}; skipping federation lineage baseline."
          fi

          FEDERATION_LINEAGE_LEDGER_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${FEDERATION_LINEAGE_LEDGER_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -n "${FEDERATION_LINEAGE_LEDGER_ARTIFACT_ID}" ]; then
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${FEDERATION_LINEAGE_LEDGER_ARTIFACT_ID}/zip" \
              > .artifacts/federation-audit-lineage-ledger-baseline.zip; then
              echo "Unable to download ${FEDERATION_LINEAGE_LEDGER_ARTIFACT_NAME} from run ${RUN_ID}; starting a new federation lineage ledger chain for this PR run."
            else

              unzip -o .artifacts/federation-audit-lineage-ledger-baseline.zip -d .artifacts/federation-audit-lineage-ledger-baseline-unpacked
              cp .artifacts/federation-audit-lineage-ledger-baseline-unpacked/federation-audit-lineage-ledger.jsonl .artifacts/federation-audit-lineage-ledger.jsonl
              echo "Federation lineage ledger seeded at .artifacts/federation-audit-lineage-ledger.jsonl"
            fi
          else
            echo "No ${FEDERATION_LINEAGE_LEDGER_ARTIFACT_NAME} artifact found in run ${RUN_ID}; starting a new federation lineage ledger chain for this PR run."
          fi

          BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_ID="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            -q '.artifacts[] | select(.name=="'"${BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_NAME}"'") | .id' | head -n 1 || true)"

          if [ -n "${BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_ID}" ]; then
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_ID}/zip" \
              > .artifacts/blueprint-lineage-ledger-baseline.zip; then
              echo "Unable to download ${BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_NAME} from run ${RUN_ID}; starting a new blueprint lineage ledger chain for this PR run."
            else

              unzip -o .artifacts/blueprint-lineage-ledger-baseline.zip -d .artifacts/blueprint-lineage-ledger-baseline-unpacked
              cp .artifacts/blueprint-lineage-ledger-baseline-unpacked/blueprint-lineage-ledger.jsonl .artifacts/blueprint-lineage-ledger.jsonl
              echo "Blueprint lineage ledger seeded at .artifacts/blueprint-lineage-ledger.jsonl"
            fi
          else
            echo "No ${BLUEPRINT_LINEAGE_LEDGER_ARTIFACT_NAME} artifact found in run ${RUN_ID}; starting a new blueprint lineage ledger chain for this PR run."
          fi

      - name: Append release trust ledger entry (pr)
        run: npm run release:trust:ledger
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify release trust ledger chain (pr)
        run: npm run release:trust:ledger:verify

      - name: Append federation lineage ledger entry (pr)
        run: npm run release:federation:lineage:ledger
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify federation lineage ledger chain (pr)
        run: npm run release:federation:lineage:ledger:verify

      - name: Append blueprint lineage ledger entry (pr)
        run: npm run release:blueprint:lineage:ledger
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify blueprint lineage ledger chain (pr)
        run: npm run release:blueprint:lineage:ledger:verify

      - name: Upload release trust report (pr)
        uses: actions/upload-artifact@v6
        with:
          name: release-trust-report-pr
          path: .artifacts/release-trust.json
          if-no-files-found: error

      - name: Upload os surface clickability probe (pr)
        uses: actions/upload-artifact@v6
        with:
          name: os-surface-clickability-probe-pr
          path: .artifacts/os-surface-clickability-probe.json
          if-no-files-found: error

      - name: Publish os surface probe summary (pr)
        if: always()
        env:
          RELEASE_TRUST_UI_PROBE_BASELINE_PATH: .artifacts/os-surface-clickability-probe-baseline.json
        run: node --import ./bench/register-alias-loader.mjs scripts/releaseTrustProbeSummary.mjs

      - name: Upload release trust ledger (pr)
        uses: actions/upload-artifact@v6
        with:
          name: release-trust-ledger-pr
          path: .artifacts/release-trust-ledger.jsonl
          if-no-files-found: error

      - name: Upload federation audit lineage (pr)
        uses: actions/upload-artifact@v6
        with:
          name: federation-audit-lineage-pr
          path: .artifacts/federation-audit-lineage.json
          if-no-files-found: error

      - name: Upload federation audit lineage ledger (pr)
        uses: actions/upload-artifact@v6
        with:
          name: federation-audit-lineage-ledger-pr
          path: .artifacts/federation-audit-lineage-ledger.jsonl
          if-no-files-found: error

      - name: Upload blueprint lineage ledger (pr)
        uses: actions/upload-artifact@v6
        with:
          name: blueprint-lineage-ledger-pr
          path: .artifacts/blueprint-lineage-ledger.jsonl
          if-no-files-found: error

      - name: Release trust diff (blocking)
        run: npm run release:trust:diff:enforced

      - name: Publish release trust summary
        if: always()
        run: npm run release:trust:summary:enforced

      - name: Publish release trust PR comment
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:trust:pr-comment:enforced
